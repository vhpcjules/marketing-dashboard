# Direct deploy to Cloudflare Pages, for when the Pages Git integration is
# not connected to this repository (it was connected to the v1 repository;
# this one began on 2026-09-04 and Pages never saw it).
#
# Runs on push to main only, AFTER the same build-and-gate the Pages build
# command would run. If the gate fails nothing is uploaded. If the two
# secrets are absent the job is skipped with a notice rather than failing,
# so the workflow is safe to merge before the secrets exist.
#
# Secrets (repository settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   an API token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the Pages project
# The project name below is the existing project (marketing-ca5.pages.dev,
# dashboards.versatile.net); deploying to it keeps the custom domain and the
# Access policy.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAGES_PROJECT: marketing-ca5
    steps:
      - uses: actions/checkout@v4

      - name: Check for deploy credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; build and gate will run but nothing is deployed."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: python3 -m pip install --upgrade pip && python3 -m pip install -r requirements.txt

      # The exact commands the Pages project runs; both default to today's date.
      - name: Build and gate
        run: python3 -m src.build && python3 -m src.validate.gate dist

      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.PAGES_PROJECT }} --branch=main --commit-dirty=true
